name: Kinoprogramm aktualisieren

on:
  schedule:
    - cron: "15 */3 * * *"   # alle 3 Stunden
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programm abrufen
        env:
          TZ: Europe/Berlin
        # schlägt der Abruf fehl, bleibt die letzte data.json stehen
        run: python scraper/scrape.py || echo "Abruf fehlgeschlagen – alte Daten bleiben"

      - name: Daten sichern
        # hält das Repo aktiv – GitHub pausiert Zeitpläne sonst nach 60 Tagen Ruhe
        run: |
          git config user.name "kino-bot"
          git config user.email "kino-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "Programm aktualisiert" && (git pull --rebase -X theirs && git push || echo "Push übersprungen"))

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
